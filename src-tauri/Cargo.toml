[package]
name = "mdnote"
version = "0.1.0"
description = "A lightweight Markdown editor for Windows"
authors = ["MDNote"]
edition = "2021"

[lib]
name = "mdnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"

# 体积优化：最小尺寸 + 链接期优化 + 去除符号 + 无栈展开
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
